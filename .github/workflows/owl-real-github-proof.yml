name: OWL real GitHub crash and concurrency proof
on:
  workflow_dispatch:
  push:
    branches: [trial/minimal-kernel-001]
    paths:
      - '.github/workflows/owl-real-github-proof.yml'
permissions:
  contents: write
jobs:
  real-github-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: owl, POSTGRES_PASSWORD: owl_ci_only, POSTGRES_DB: owl}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owl" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://owl:owl_ci_only@localhost:5432/owl
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWL_RUN_ID: ${{ github.run_id }}
      OWL_REPO: ${{ github.repository }}
      OWL_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r experiments/pg_worker/requirements.txt
      - name: New canary, SIGKILL, restart and concurrent recovery
        run: python experiments/pg_worker/real_github_trial.py
