name: OWL runtime attestation
on:
  pull_request:
  workflow_dispatch:
jobs:
  attestation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_runtime_attestation.py' -v
