name: OWL production outbox candidate
on:
  pull_request:
    paths:
      - 'sovereign/production_outbox.py'
      - 'sovereign/test_production_outbox.py'
      - 'runtime.py'
      - '.github/workflows/owl-production-outbox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed outbox tests
        run: python -m unittest sovereign.test_production_outbox -v
      - name: Syntax validation
        run: python -m py_compile sovereign/production_outbox.py runtime.py
